name: ci

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.14
          check-latest: false
          cache: false
      - name: Repository gates
        shell: bash
        run: |
          test -z "$(gofmt -l .)"
          go test -count=1 ./...
          go vet ./...
          go test -race -count=1 ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -buildvcs=false -o /tmp/proxyctl-linux-arm64 ./cmd/proxyctl
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -o /tmp/proxyctl-linux-amd64 ./cmd/proxyctl
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 tools/secret_scan.py --self-test
          python3 tools/secret_scan.py
          python3 scripts/release/release.py validate-lock
          python3 scripts/release/release.py lint-workflows
      - name: Vulnerability scan
        shell: bash
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          "$(go env GOPATH)/bin/govulncheck" ./...

  upstream-hashes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Verify locked upstream assets
        run: python3 scripts/release/release.py fetch --cache-dir /tmp/prx02-upstreams
