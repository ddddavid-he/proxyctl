name: candidate-release

on:
  push:
    branches: [main, master]
    tags: ['proxy-v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version (vMAJOR.MINOR.PATCH)
        required: true
        default: v0.4.0
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        role: [gateway, egress]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.14
          check-latest: false
          cache: false
      - name: Build and verify Linux candidate
        env:
          INPUT_VERSION: ${{ inputs.version }}
          TARGET_ROLE: ${{ matrix.role }}
          TARGET_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#proxy-}}"
          if [[ "${GITHUB_REF_TYPE}" != tag && -z "${INPUT_VERSION}" ]]; then
            VERSION="v0.4.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          python3 scripts/release/release.py fetch --cache-dir /tmp/prx02-upstreams
          python3 scripts/release/release.py build \
            --role "${TARGET_ROLE}" \
            --arch "${TARGET_ARCH}" \
            --version "${VERSION}" \
            --commit "${GITHUB_SHA}" \
            --source-repository "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --builder-environment github \
            --builder-identity "${GITHUB_REPOSITORY_ID}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --host-label "${RUNNER_NAME}" \
            --cache-dir /tmp/prx02-upstreams \
            --output-dir dist
          python3 scripts/release/release.py verify "dist/proxyctl-${TARGET_ROLE}-linux-${TARGET_ARCH}.tar.gz" --role "${TARGET_ROLE}"
          if [[ "${TARGET_ROLE}" == gateway ]]; then
            mkdir -p /tmp/gateway-check
            tar -xzf "dist/proxyctl-${TARGET_ROLE}-linux-${TARGET_ARCH}.tar.gz" -C /tmp/gateway-check
            python3 tools/verify_engine_accounting.py /tmp/gateway-check/mihomo
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-${{ matrix.role }}-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  build-runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build Linux runtime image
        env:
          INPUT_VERSION: ${{ inputs.version }}
          TARGET_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#proxy-}}"
          if [[ "${GITHUB_REF_TYPE}" != tag && -z "${INPUT_VERSION}" ]]; then
            VERSION="v0.4.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          mkdir -p dist
          docker buildx build \
            --platform "linux/${TARGET_ARCH}" \
            --tag "private-proxy-runtime:${VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --output "type=docker,dest=/tmp/private-proxy-runtime-linux-${TARGET_ARCH}.tar" \
            --file deploy/compose/Dockerfile.runtime .
          gzip -n -9 -c "/tmp/private-proxy-runtime-linux-${TARGET_ARCH}.tar" > "dist/private-proxy-runtime-linux-${TARGET_ARCH}.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-runtime-linux-${{ matrix.arch }}
          path: dist/private-proxy-runtime-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  attest:
    needs: build
    strategy:
      matrix:
        role: [gateway, egress]
        arch: [amd64, arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: candidate-${{ matrix.role }}-linux-${{ matrix.arch }}
          path: dist
      - uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: dist/*.tar.gz

  attest-runtime:
    needs: build-runtime
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: candidate-runtime-linux-${{ matrix.arch }}
          path: dist
      - uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: dist/private-proxy-runtime-linux-${{ matrix.arch }}.tar.gz

  publish:
    if: startsWith(github.ref, 'refs/tags/proxy-v')
    needs: [attest, attest-runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: candidate-*
          path: dist
          merge-multiple: true
      - name: Publish immutable candidate assets only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          (cd dist && shasum -a 256 ./*.tar.gz > SHA256SUMS)
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME} candidate" \
            --notes "Linux amd64 and arm64 candidate artifacts. No host installation or activation was performed."
