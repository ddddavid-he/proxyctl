name: candidate-release

on:
  push:
    tags: ['proxy-v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        role: [gateway, egress]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.14
          check-latest: false
          cache: false
      - name: Build deterministic candidate
        shell: bash
        run: |
          python3 scripts/release/release.py fetch --cache-dir /tmp/prx02-upstreams
          python3 scripts/release/release.py build \
            --role "${{ matrix.role }}" \
            --version "${GITHUB_REF_NAME#proxy-}" \
            --commit "${GITHUB_SHA}" \
            --source-repository "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --builder-environment github \
            --builder-identity "${GITHUB_REPOSITORY_ID}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --host-label "${RUNNER_NAME}" \
            --cache-dir /tmp/prx02-upstreams \
            --output-dir dist
          python3 scripts/release/release.py verify dist/proxyctl-${{ matrix.role }}-linux-${{ matrix.role == 'gateway' && 'arm64' || 'amd64' }}.tar.gz --role "${{ matrix.role }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-${{ matrix.role }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  attest:
    needs: build
    strategy:
      matrix:
        role: [gateway, egress]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: candidate-${{ matrix.role }}
          path: dist
      - uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: dist/*.tar.gz

  publish:
    needs: attest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: candidate-*
          path: dist
          merge-multiple: true
      - name: Publish immutable candidate assets only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shasum -a 256 dist/*.tar.gz > dist/SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME} candidate" \
            --notes "Candidate artifacts only. No host installation or activation was performed."
